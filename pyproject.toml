[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trekmark-ml"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3",
    "transformers==4.57.6",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["landmark_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises real local DINOv2 weights"]
