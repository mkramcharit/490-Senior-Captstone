[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trekmark-ml"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2,<3",
    "transformers==4.57.6",
    "numpy>=1.26,<3",
    "faiss-cpu>=1.8,<2",
    "Pillow>=10,<13",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
calibration = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["ml_model"]
include = ["landmark_ml*"]

[tool.pytest.ini_options]
testpaths = ["ml_model/tests", "backend/tests"]
pythonpath = ["ml_model", "."]
markers = ["integration: exercises real local DINOv2 weights"]
